# Include inside ARFitt's HTTPS server block. This is a fixed upstream,
# with only Camera Kit service paths allowed; it is not a general URL proxy.
location ~ ^/(com\.snap\.camerakit\.v3\.(Metrics|Lenses|HostedLenses)|snapchat\.cdp\.cof\.CircumstancesService)/[A-Za-z]+$ {
    limit_except POST OPTIONS { deny all; }

    proxy_pass https://camera-kit-api.snapar.com;
    proxy_http_version 1.1;
    proxy_set_header Host camera-kit-api.snapar.com;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_ssl_server_name on;
    proxy_ssl_name camera-kit-api.snapar.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}
